<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Card design</title>
    <style>
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            font-family: sans-serif;
            color: white;
        }
        .card-container{
            width: 300px;
            height: 400px;
            perspective: 1000px;
        }
        .card{
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }
        .front, .back{
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 15px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            backface-visibility: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .front{
            background-color: #ff4757;
        }
        .back{
            background-color: #2ed573;
            transform: rotateY(180deg);
        }
        .card-container:hover .card{
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <div class="card-container">
       <div class="card">
         <div class="front">
            <h2>Front side</h2>
        </div>
        <div class="back">
            <h2>back side</h2>
        </div>
       </div>
    </div>
</body>
</html>
